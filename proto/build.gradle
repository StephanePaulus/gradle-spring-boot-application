
plugins {
    id 'java-library'
    id 'com.google.protobuf' version "0.8.18"
    id 'idea'
    id 'maven-publish'
    id 'com.github.imflog.kafka-schema-registry-gradle-plugin' version "2.1.1"
}

group = 'org.example'
version = '1.0.0'
description = 'simple spring-boot gradle application'

repositories {
    mavenCentral()
}

dependencies {
    api "com.google.protobuf:protobuf-java:3.25.2"
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

schemaRegistry {
    url = "http://localhost:8081"
    register {
        //TOPIC
        subject('test-value', 'proto/src/main/proto/example.proto', "PROTOBUF")
                .setNormalized(true)
    }
}


protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.23.4"
    }
    generatedFilesBaseDir = "$projectDir/build/generated"
    generateProtoTasks {
    }
}

idea {
    module {
        sourceDirs += file("build/generated/main/java")
        generatedSourceDirs += file("build/generated/main/java")
    }
}

